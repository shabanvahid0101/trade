name: Bot Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

concurrency:
  group: trading-repo-writes
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh alert data before health check
        run: |
          python alert_bot.py --update --update-fundamentals --send-hold --symbol BTC/USDT --timeframe 1h --data dataset/1h-btc_history.csv --fundamental-data dataset/1h-btc_fundamentals.csv --horizons 1,3,6 --min-agree 1 --min-confidence 0.45 --strategy hybrid --exchange-fallbacks binance,okx,kucoin,bybit --max-data-age-hours 1.25 --max-fetch-batches 5 --state-file alert_state.json

      - name: Send bot health report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STRICT: "1"
        run: |
          python -c "import os; assert os.getenv('TELEGRAM_TOKEN'), 'Missing TELEGRAM_TOKEN secret'; assert os.getenv('TELEGRAM_CHAT_ID'), 'Missing TELEGRAM_CHAT_ID secret'"
          python health_check.py --telegram --symbol BTC/USDT --timeframe 1h --data dataset/1h-btc_history.csv --fundamental-data dataset/1h-btc_fundamentals.csv --paper-state paper_state.json --alert-state alert_state.json --horizons 1,3,6 --initial-capital 100 --max-data-age-hours 1.5 --max-fundamental-age-hours 2.5

      - name: Commit refreshed health data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alert_state.json dataset/1h-btc_history.csv dataset/1h-btc_fundamentals.csv
          if git diff --cached --quiet; then
            echo "No health refresh changes to commit."
          else
            git commit -m "Refresh health check data"
            git pull --rebase origin main
            git push
          fi
