name: 5m Staging Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "22 */6 * * *"

jobs:
  health-5m-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 5m staging health check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STRICT: "1"
        run: |
          python -c "import os; assert os.getenv('TELEGRAM_TOKEN'), 'Missing TELEGRAM_TOKEN secret'; assert os.getenv('TELEGRAM_CHAT_ID'), 'Missing TELEGRAM_CHAT_ID secret'"
          python health_check.py --telegram --symbol BTC/USDT --timeframe 5m --data dataset/5m_btc_history.csv --fundamental-data none --model-dir models/5m_staging --paper-state paper_state_5m_staging.json --horizons 1,3,6 --initial-capital 100 --max-data-age-hours 1 --skip-alert-state
