name: Paper Trading

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

concurrency:
  group: trading-repo-writes
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test models
        run: |
          python smoke_test_models.py --symbol BTC/USDT --timeframe 1h --horizons 1,3,6 --sanitize

      - name: Run paper trading step
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STRICT: "1"
        run: |
          python -c "import os; assert os.getenv('TELEGRAM_TOKEN'), 'Missing TELEGRAM_TOKEN secret'; assert os.getenv('TELEGRAM_CHAT_ID'), 'Missing TELEGRAM_CHAT_ID secret'"
          python paper_trader.py --mode single --update --update-fundamentals --telegram --symbol BTC/USDT --timeframe 1h --data dataset/1h-btc_history.csv --fundamental-data dataset/1h-btc_fundamentals.csv --horizons 1,3,6 --initial-capital 100 --min-agree 1 --min-confidence 0.45 --strategy hybrid --threshold 0.0015 --fee-rate 0.001 --spread-bps 2 --slippage-bps 2 --stop-loss-pct 0.012 --take-profit-pct 0.024 --max-holding-candles 24 --leverage 1 --risk-enabled --risk-position-size-pct 1.0 --risk-reduced-position-size-pct 0.35 --risk-reduce-drawdown-pct 3 --risk-max-drawdown-pct 5 --risk-max-loss-streak 3 --risk-min-equity 50 --risk-recovery-enabled --risk-recovery-position-size-pct 0.10 --risk-recovery-min-signal-quality 0.65 --risk-recovery-max-loss-streak 2 --dynamic-position-sizing --dynamic-min-position-size-pct 0.15 --dynamic-max-position-size-pct 0.75 --state-file paper_state.json --exchange-fallbacks binance,okx,kucoin,bybit --max-data-age-hours 1.25 --max-fetch-batches 5

      - name: Audit refreshed data
        run: |
          python data_quality.py --write --price-data dataset/1h-btc_history.csv --fundamental-data dataset/1h-btc_fundamentals.csv --timeframe 1h --report data_quality_report.json

      - name: Commit paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state.json data_quality_report.json dataset/1h-btc_history.csv dataset/1h-btc_fundamentals.csv
          if git diff --cached --quiet; then
            echo "No paper trading state changes to commit."
          else
            git commit -m "Update paper trading state"
            git pull --rebase origin main
            git push
          fi
