name: BitTrade Data and Research

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
    - cron: "29 2 * * *"

permissions:
  contents: write

concurrency:
  # Existing data/paper workflows use this group for repository writes.
  group: trading-repo-writes
  cancel-in-progress: false

jobs:
  bittrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh closed BitTrade candles
        id: collect
        run: python bittrade_data.py

      - name: Install research dependencies
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '29 2 * * *'
        run: python -m pip install -r requirements-bittrade.txt

      - name: Verify data and execution accounting
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '29 2 * * *'
        run: python -m unittest discover -s tests -p test_bittrade.py -v

      - name: Train and evaluate spot models
        id: research
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '29 2 * * *'
        run: |
          python bittrade_research.py
          cat reports/bittrade/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve diagnostic reports and models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bittrade-${{ github.run_id }}
          path: |
            dataset/bittrade/collection_report.json
            reports/bittrade/
          retention-days: 30
          if-no-files-found: warn

      - name: Commit collected data and research reports
        # Training failure must not throw away successfully collected history.
        if: always() && steps.collect.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataset/bittrade
          if [ -f reports/bittrade/research_report.json ]; then
            git add reports/bittrade/research_report.json reports/bittrade/SUMMARY.md
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh BitTrade candles and research"
            # Only this workflow writes these paths; rebase preserves other jobs.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 5
            done
            exit 1
          fi
