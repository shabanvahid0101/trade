name: BitTrade Data and Research

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
    - cron: "29 2 * * *"

permissions:
  contents: write

concurrency:
  # Existing data/paper workflows use this group for repository writes.
  group: trading-repo-writes
  cancel-in-progress: false

jobs:
  bittrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"

      - name: Refresh closed BitTrade candles
        id: collect
        run: python bittrade_data.py

      - name: Install research dependencies
        id: dependencies
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python -m pip install -r requirements-bittrade.txt

      - name: Verify data and execution accounting
        id: checks
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m unittest discover -s tests -p 'test_bittrade*.py' -v

      - name: Train and evaluate spot models
        id: research
        # Refresh probabilities on each run. Never trade yesterday's report.
        if: ${{ !cancelled() && steps.collect.outcome == 'success' && steps.checks.outcome == 'success' }}
        run: |
          python bittrade_research.py
          cat reports/bittrade/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Advance experimental paper portfolio
        id: paper
        # The stdlib-only exit manager still runs after collection/training fails.
        if: ${{ !cancelled() && steps.python.outcome == 'success' && steps.checkout.outcome == 'success' && steps.checks.outcome != 'failure' }}
        env:
          ALLOW_ENTRIES: ${{ steps.collect.outcome == 'success' && steps.research.outcome == 'success' && steps.checks.outcome == 'success' }}
        run: |
          extra=()
          if [ "$ALLOW_ENTRIES" != "true" ]; then
            extra+=(--exits-only)
          fi
          python bittrade_paper.py step --mode experimental "${extra[@]}"
          cat reports/bittrade/PAPER_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Persist data, portfolio and notification outbox before delivery
        id: persist
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash .github/scripts/commit-bittrade.sh snapshot

      - name: Send pending BitTrade entry and exit notifications
        id: notify
        if: ${{ !cancelled() && steps.persist.outcome == 'success' && steps.paper.outcome == 'success' }}
        env:
          BITTRADE_TELEGRAM_ENABLED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bittrade_paper.py notify

      - name: Persist delivery receipts even after partial Telegram failure
        if: ${{ !cancelled() && steps.persist.outcome == 'success' && (steps.notify.outcome == 'success' || steps.notify.outcome == 'failure') }}
        run: bash .github/scripts/commit-bittrade.sh receipts

      - name: Preserve diagnostic reports and models
        # Daily/manual artifacts; the ledger/reports persist in Git every run.
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '29 2 * * *' || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: bittrade-${{ github.run_id }}
          path: |
            dataset/bittrade/collection_report.json
            reports/bittrade/
          retention-days: 30
          if-no-files-found: warn
