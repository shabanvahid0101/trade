name: Dataset Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "10 1,13 * * *"

permissions:
  contents: write

concurrency:
  group: trading-repo-writes
  cancel-in-progress: false

jobs:
  refresh-datasets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh and audit datasets
        run: |
          python dataset_maintenance.py --symbol BTC/USDT --exchange-fallbacks binance,okx,kucoin,bybit --one-hour-data dataset/1h-btc_history.csv --one-hour-fundamentals dataset/1h-btc_fundamentals.csv --five-minute-data dataset/5m_btc_history.csv --fifteen-minute-data dataset/15m_btc_history_5000.csv --fifteen-minute-fundamentals dataset/15m_btc_fundamentals.csv --fifteen-minute-rows 5000 --one-hour-fetch-batches 5 --five-minute-fetch-batches 20 --one-hour-max-age-hours 2.5 --five-minute-max-age-hours 1.0 --update-fundamentals --derive-fifteen-minute --report dataset_maintenance_report.json

      - name: Commit refreshed datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataset_maintenance_report.json dataset/1h-btc_history.csv dataset/1h-btc_fundamentals.csv dataset/5m_btc_history.csv dataset/15m_btc_history_5000.csv dataset/15m_btc_fundamentals.csv
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "Refresh market datasets"
            git pull --rebase origin main
            git push
          fi
