name: Paper Trading 5m Staging

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write

concurrency:
  group: trading-repo-writes
  cancel-in-progress: false

jobs:
  paper-5m-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check 5m paper trading gate
        id: gate
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STRICT: "1"
        run: |
          python -c "import os; assert os.getenv('TELEGRAM_TOKEN'), 'Missing TELEGRAM_TOKEN secret'; assert os.getenv('TELEGRAM_CHAT_ID'), 'Missing TELEGRAM_CHAT_ID secret'"
          python trading_gate.py --telegram --label "Paper Trading 5m Staging" --data dataset/5m_btc_history.csv --state-file paper_state_5m_staging.json --initial-capital 100 --min-closed-trades 50 --min-return-pct 0 --min-profit-factor 1.10 --max-drawdown-pct 2

      - name: Smoke test 5m staging models
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python smoke_test_models.py --symbol BTC/USDT --timeframe 5m --horizons 1,3,6 --model-dir models/5m_staging

      - name: Run 5m staging paper trading step
        if: steps.gate.outputs.allowed == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STRICT: "1"
        run: |
          python -c "import os; assert os.getenv('TELEGRAM_TOKEN'), 'Missing TELEGRAM_TOKEN secret'; assert os.getenv('TELEGRAM_CHAT_ID'), 'Missing TELEGRAM_CHAT_ID secret'"
          python paper_trader.py --mode single --update --telegram --telegram-label "Paper Trading 5m Staging" --symbol BTC/USDT --timeframe 5m --data dataset/5m_btc_history.csv --model-dir models/5m_staging --horizons 1,3,6 --initial-capital 100 --min-agree 2 --min-confidence 0.52 --strategy hybrid --threshold 0.0004 --fee-rate 0.001 --spread-bps 2 --slippage-bps 2 --stop-loss-pct 0.004 --take-profit-pct 0.008 --max-holding-candles 72 --leverage 1 --risk-enabled --risk-position-size-pct 0.8 --risk-reduced-position-size-pct 0.35 --risk-reduce-drawdown-pct 2 --risk-max-drawdown-pct 4 --risk-max-loss-streak 3 --risk-min-equity 50 --risk-recovery-enabled --risk-recovery-position-size-pct 0.12 --risk-recovery-min-signal-quality 0.62 --risk-recovery-max-loss-streak 2 --dynamic-position-sizing --dynamic-min-position-size-pct 0.15 --dynamic-max-position-size-pct 0.75 --state-file paper_state_5m_staging.json --exchange-fallbacks binance,okx,kucoin,bybit --max-data-age-hours 0.5 --max-fetch-batches 10

      - name: Commit 5m staging paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state_5m_staging.json dataset/5m_btc_history.csv
          if git diff --cached --quiet; then
            echo "No 5m staging paper changes to commit."
          else
            git commit -m "Update 5m staging paper trading state"
            git pull --rebase origin main
            git push
          fi
