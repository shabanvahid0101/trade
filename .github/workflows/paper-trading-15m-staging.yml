name: Paper Trading 15m Staging

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: write

concurrency:
  group: trading-repo-writes
  cancel-in-progress: false

jobs:
  paper-15m-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test 15m staging model
        run: |
          python smoke_test_models.py --symbol BTC/USDT --timeframe 15m --horizons 3 --model-dir models/15m_fundamental_staging

      - name: Run 15m staging paper trading step
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STRICT: "1"
        run: |
          python -c "import os; assert os.getenv('TELEGRAM_TOKEN'), 'Missing TELEGRAM_TOKEN secret'; assert os.getenv('TELEGRAM_CHAT_ID'), 'Missing TELEGRAM_CHAT_ID secret'"
          python paper_trader.py --mode single --update --update-fundamentals --telegram --telegram-label "Paper Trading 15m Staging" --symbol BTC/USDT --timeframe 15m --data dataset/15m_btc_history_5000.csv --fundamental-data dataset/15m_btc_fundamentals.csv --model-dir models/15m_fundamental_staging --horizons 3 --initial-capital 100 --min-agree 1 --min-confidence 0.48 --strategy model --threshold 0.0006 --fee-rate 0.001 --spread-bps 2 --slippage-bps 2 --leverage 1 --risk-enabled --risk-position-size-pct 1.0 --risk-reduced-position-size-pct 0.5 --risk-reduce-drawdown-pct 3 --risk-max-drawdown-pct 5 --risk-max-loss-streak 3 --risk-min-equity 50 --dynamic-position-sizing --dynamic-min-position-size-pct 0.25 --dynamic-max-position-size-pct 1.0 --state-file paper_state_15m_staging.json --exchange-fallbacks binance,okx,kucoin,bybit --max-data-age-hours 1.0 --max-fetch-batches 5

      - name: Commit 15m staging paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state_15m_staging.json dataset/15m_btc_history_5000.csv dataset/15m_btc_fundamentals.csv
          if git diff --cached --quiet; then
            echo "No 15m staging paper changes to commit."
          else
            git commit -m "Update 15m staging paper trading state"
            git pull --rebase origin main
            git push
          fi
